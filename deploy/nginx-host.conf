# Host nginx server blocks -> /etc/nginx/sites-available/nebulalabs.es
# Reference copy: the live file on the VPS is edited by hand (root).
# Certificate issued with: certbot --nginx -d nebulalabs.es -d www.nebulalabs.es

# http -> https (apex and www)
server {
    listen 80;
    listen [::]:80;
    server_name nebulalabs.es www.nebulalabs.es;
    return 301 https://nebulalabs.es$request_uri;
}

# https www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nebulalabs.es;

    ssl_certificate /etc/letsencrypt/live/nebulalabs.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nebulalabs.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nebulalabs.es$request_uri;
}

# https apex -> container (127.0.0.1:8090, see deploy/docker-compose.yml)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nebulalabs.es;

    ssl_certificate /etc/letsencrypt/live/nebulalabs.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nebulalabs.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
