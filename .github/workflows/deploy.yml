name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "nebulalabs/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/urchegui/nebulalabs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Web3Forms access key is public by design (it ships in the client bundle)
      - name: Check build variables
        env:
          WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY || secrets.WEB3FORMS_KEY }}
        run: |
          [ -n "$WEB3FORMS_KEY" ] || { echo "::error::WEB3FORMS_KEY is not set (Actions variable or secret)"; exit 1; }

      - uses: docker/build-push-action@v6
        with:
          context: ./nebulalabs
          build-args: |
            VITE_WEB3FORMS_KEY=${{ vars.WEB3FORMS_KEY || secrets.WEB3FORMS_KEY }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # Secrets pasted from Windows may carry \r or lack the trailing newline
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::VPS_SSH_KEY is not a valid private key"; exit 1; }

      - name: Deploy to VPS
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          scp deploy/docker-compose.yml "$TARGET:/var/www/nebulalabsweb/docker-compose.yml"
          ssh "$TARGET" bash -s <<EOF
            set -e
            cd /var/www/nebulalabsweb
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            IMAGE_TAG=${{ github.sha }} docker compose pull
            IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
          EOF

      - name: Smoke test
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'for i in 1 2 3 4 5; do curl -fsS -o /dev/null http://127.0.0.1:8090/ && exit 0; sleep 3; done; exit 1'
