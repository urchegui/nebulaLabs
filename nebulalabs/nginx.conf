server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative redirects: TLS terminates at the host nginx, so an absolute one would say http://
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Security headers. Locations below must NOT use add_header: in nginx any
    # add_header inside a location drops every add_header inherited from server.
    # TLS terminates at the host nginx, which passes these through.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP in report-only mode: violations show in the browser console, nothing is blocked.
    # When production shows no violations, rename the header to Content-Security-Policy (see SECURITY_AUDIT.md).
    # - script/connect/img: Google Analytics 4 (only loaded after consent) and Web3Forms
    # - style 'unsafe-inline': framer-motion and React set inline style attributes
    # - img data: the logo is inlined as an SVG data URI
    # - sha256: the one-line inline script in index.html that adds the `js` class (update if it changes)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://www.googletagmanager.com; connect-src 'self' https://api.web3forms.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    error_page 404 /404.html;

    # Vite emits content-hashed filenames under /assets
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Legacy URL of the email signature logo (Hostinger era): emails already sent still point here
    location = /nebulaFondo.png {
        try_files /email/NEBULA_FONDO_NEGRO.png =404;
    }

    # Canonical Spanish home is /es/
    location = /es {
        return 301 /es/;
    }

    # AI Central replaces the old "AI Business" page
    location ~ ^/ai-business/?$ {
        return 301 /ai-central;
    }

    # Prerendered pages live in <path>/index.html. Unknown paths get the real 404 page.
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }
}
